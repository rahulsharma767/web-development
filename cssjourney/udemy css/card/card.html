<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>producty card</title>
    <link rel="stylesheet" href="card.css">
  </head>
  <body>
    <div class="content">
      <div class="product-card">
        <div class="product-card-image">
          <img src="shoes.png" alt="shoes" />
        </div>
        <div class="product-card-info">
          <h1 class="product-card-title">Nike Air Max</h1>
          <p class="product-card-description">
            Experience ultimate comfort and style with these iconic Nike Air Max
            sneakers.
          </p>
          <div class="product-card-price-row">
            <span class="product-card-price"> $100.44 </span>
            <button class="product-card--btn">Add to cart</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
