<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color:#facccc;
        border-radius: 10px;
        padding:30px;
        width: 300px;

    
      }
      h1{
        color: rgb(222, 58, 21);
        text-align: center;
        margin-bottom: 30px;

      }
      form{
        display: flex;
        flex-direction: column;
       
      }
      input{
        margin-bottom: 15px;
        padding: 5px;
        border-radius: 5px;
        background-color: rgba(178, 188, 178, 0.667);
        border: 1px solid black;
      }
      button{
        background-color: rgb(70, 70, 224);
        color: aliceblue;
        padding: 10px;
        border-radius: 8px;

      }
      button:hover{
        background-color:#170750 ;
      }

    </style>
  </head>
  <body>
    <div class="card">
      <h1>login</h1>
      <form action="">
        <input type="email" placeholder="email" />
        <input type="password" placeholder="password" />

        <button type="submit">login</button>
      </form>
    </div>
  </body>
</html>
